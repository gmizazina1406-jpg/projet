    <title>Choix du jeu</title>

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;

            background: linear-gradient(180deg, #261233, #5b2a75);
            color: white;
            font-family: Arial, sans-serif;
        }

        .game-card {
            width: min(92%, 760px);
            padding: 32px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            box-sizing: border-box;
        }

        .selection-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 16px 0 24px;
        }

        .status-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 0 0 24px;
        }

        .badge {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 999px;
            background: #ffcf6e;
            color: #2d1638;
            font-weight: bold;
        }

        .mode-buttons {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin: 20px 0 28px;
        }

        .mode-button,
        .secondary-button,
        .option-button {
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: white;
            font-size: 1rem;
        }

        .mode-button {
            min-width: 220px;
            padding: 16px 20px;
            background: #ff7eb3;
            font-weight: bold;
        }

        .secondary-button {
            margin-top: 20px;
            padding: 12px 20px;
            background: #7d66c2;
        }

        .game-zone {
            text-align: left;
            padding: 24px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
        }

        .game-zone h2 {
            margin-top: 0;
            text-align: center;
        }

        .answer-input {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .validate-button {
            margin-top: 14px;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #35c79a;
            color: white;
            cursor: pointer;
            font-size: 1rem;
        }

        .options {
            display: grid;
            gap: 12px;
            margin-top: 18px;
        }

        .option-button {
            width: 100%;
            padding: 14px 16px;
            background: #4c3d90;
            text-align: left;
        }

        .result {
            min-height: 28px;
            margin-top: 16px;
            font-weight: bold;
            text-align: center;
        }

        .next-question-button {
            display: none;
            margin: 16px auto 0;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #ffcf6e;
            color: #2d1638;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }
    </style>
</head>

        function renderNextButton() {
            if (currentIndex >= currentQuestions.length - 1) {
                return '';
            }

            return '<button class="next-question-button" id="next-question-button" type="button" onclick="goToNextQuestion()">Question suivante</button>';
        }

        function renderRiddleQuestion() {
            const riddle = currentQuestions[currentIndex];

            document.getElementById('game-zone').innerHTML = `
                <h2>Devinette pour ${playerName}</h2>
                <p>Question ${currentIndex + 1} sur ${currentQuestions.length}</p>
                <p>${riddle.question}</p>
                <input class="answer-input" id="riddle-answer" type="text" placeholder="Ta reponse">
                <button class="validate-button" type="button" onclick="checkRiddle()">Valider</button>
                <p class="result" id="result"></p>
                ${renderNextButton()}
            `;
        }

        function renderQuizQuestion() {
            const quiz = currentQuestions[currentIndex];
            const optionsHtml = quiz.options
                .map((option, index) => `<button class="option-button" type="button" onclick="checkQuiz(${index})">${option}</button>`)
                .join('');

            document.getElementById('game-zone').innerHTML = `
                <h2>Question a choix multiple</h2>
                <p>Question ${currentIndex + 1} sur ${currentQuestions.length}</p>
                <p>${quiz.question}</p>
                <div class="options">${optionsHtml}</div>
                <p class="result" id="result"></p>
                ${renderNextButton()}
            `;
        }

        function showNextButton() {
            const button = document.getElementById('next-question-button');
            if (button) {
                button.style.display = 'block';
            }
        }

        function finishGame(message) {
            document.getElementById('game-zone').innerHTML = `
                <h2>Partie terminee</h2>
                <p>${message}</p>
                <p>Score final : ${score}</p>
                <p>Chances restantes : ${lives}</p>
                <button class="validate-button" type="button" onclick="${currentMode === 'riddle' ? 'showRiddle()' : 'showQuiz()'}">Rejouer</button>
            `;
        }

        function goToNextQuestion() {
            currentIndex += 1;
            answered = false;

            if (currentIndex >= currentQuestions.length) {
                finishGame('Tu as termine toutes les questions, ' + playerName + ' !');
                return;
            }

            if (currentMode === 'riddle') {
                renderRiddleQuestion();
                return;
            }

            renderQuizQuestion();
        }

        function showRiddle() {
            resetGame('riddle');
            currentQuestions = getRiddle();
            renderRiddleQuestion();
        }

        function checkRiddle() {
            if (lives <= 0 || answered) {
                return;
            }

            const riddle = currentQuestions[currentIndex];
            const answer = document.getElementById('riddle-answer').value.trim().toLowerCase();
            const result = document.getElementById('result');

            if (answer === riddle.answer.toLowerCase()) {
                answered = true;
                score += 1;
                updateStatus();
                if (currentIndex === currentQuestions.length - 1) {
                    finishGame('Tu as termine toutes les devinettes, ' + playerName + ' !');
                    return;
                }

                result.textContent = 'Bravo ' + playerName + ' ! Bonne reponse.';
                showNextButton();
                return;
            }

            lives -= 1;
            updateStatus();

            if (lives > 0) {
                result.textContent = 'Ce n est pas la bonne reponse. Il te reste ' + lives + ' chance(s).';
                return;
            }

            answered = true;
            finishGame('Tu as perdu tes 3 chances. La bonne reponse etait : ' + riddle.answer + '.');
        }

        function showQuiz() {
            resetGame('quiz');
            currentQuestions = getQuiz();
            renderQuizQuestion();
        }

        function checkQuiz(index) {
            if (lives <= 0 || answered) {
                return;
            }

            const quiz = currentQuestions[currentIndex];
            const result = document.getElementById('result');

            if (index === quiz.correct) {
                answered = true;
                score += 1;
                updateStatus();
                if (currentIndex === currentQuestions.length - 1) {
                    finishGame('Tu as termine toutes les questions du QCM, ' + playerName + ' !');
                    return;
                }

                result.textContent = 'Bonne reponse ' + playerName + ' !';
                showNextButton();
                return;
            }

            lives -= 1;
            updateStatus();

            if (lives > 0) {
                result.textContent = 'Mauvaise reponse. Il te reste ' + lives + ' chance(s).';
                return;
            }

            answered = true;
            finishGame('Tu as perdu tes 3 chances. La bonne reponse etait : ' + quiz.options[quiz.correct] + '.');
        }

        updateStatus();
    </script>
